AWSTemplateFormatVersion: '2010-09-09'
Description: Add read-only recordings SSM Parameter Store access to the existing GitHub Actions deployment role.

Parameters:
  DeploymentRoleName:
    Type: String
    Default: GitHubActionsRecordingsDeployRole
    Description: Existing GitHub Actions OIDC deployment role for this repository.
  ParameterPrefix:
    Type: String
    Default: recordings/prod
    AllowedPattern: '^[A-Za-z0-9_.\-/]+$'
    Description: Parameter Store hierarchy without the leading slash.

Resources:
  RecordingsSsmReadPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: recordings-production-ssm-read
      Roles:
        - !Ref DeploymentRoleName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ReadRecordingsProductionParameters
            Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:GetParametersByPath
            Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ParameterPrefix}/*

Outputs:
  ParameterPath:
    Description: SSM hierarchy readable by the GitHub Actions deployment role.
    Value: !Sub /${ParameterPrefix}
