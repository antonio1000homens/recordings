AWSTemplateFormatVersion: '2010-09-09'
Description: Least-privilege IAM principal used by the Cloudflare recordings ingress Worker

Parameters:
  UploadFunctionName:
    Type: String
    Default: recordings-upload
  CallbackFunctionName:
    Type: String
    Default: recordings-callback
  WorkerInvokerUserName:
    Type: String
    Default: recordings-worker-invoker

Resources:
  RecordingsWorkerInvoker:
    Type: AWS::IAM::User
    Properties:
      UserName: !Ref WorkerInvokerUserName
      Policies:
        - PolicyName: InvokeRecordingsFunctionUrlsOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: InvokeFunctionUrls
                Effect: Allow
                Action: lambda:InvokeFunctionUrl
                Resource:
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${UploadFunctionName}
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${CallbackFunctionName}
                Condition:
                  StringEquals:
                    lambda:FunctionUrlAuthType: AWS_IAM
              - Sid: InvokeFunctionsViaUrl
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${UploadFunctionName}
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${CallbackFunctionName}
                Condition:
                  Bool:
                    lambda:InvokedViaFunctionUrl: 'true'

Outputs:
  WorkerInvokerUserName:
    Value: !Ref RecordingsWorkerInvoker
    Description: Create/rotate an access key for this principal out-of-band and store it only as Cloudflare Worker secrets.
