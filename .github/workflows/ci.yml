name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  public-source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check public source boundary
        run: bash scripts/check-public-source.sh

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
          token: ${{ github.token }}
      - name: Syntax-check deployment scripts
        run: >-
          bash -n
          pipeline/deploy.sh
          transform/deploy.sh
          infrastructure/bootstrap-deployment-role.sh
          infrastructure/bootstrap-ssm-secrets-access.sh
          infrastructure/test-bootstrap-ssm-secrets-access.sh
          cloudflare/recordings-ingress/deploy-ci.sh
          scripts/bootstrap-ssm-migration.sh
          scripts/load-ssm-secrets.sh
          scripts/test-bootstrap-ssm-migration-portability.sh
          scripts/test-load-ssm-secrets.sh
      - name: Enforce SSM-only deployment workflows
        run: |
          workflows=(.github/workflows/deploy.yml .github/workflows/deploy-ingress.yml)
          if grep -En 'secrets\.[A-Z0-9_]|bitwarden/sm-action|SECRETS_BACKEND|BW_' "${workflows[@]}"; then
            echo 'Production deployment workflows must use GitHub variables plus SSM, not GitHub secrets or Bitwarden.' >&2
            exit 1
          fi
          grep -Fq 'bash scripts/load-ssm-secrets.sh deploy' .github/workflows/deploy.yml
          grep -Fq 'bash scripts/load-ssm-secrets.sh ingress' .github/workflows/deploy-ingress.yml
          grep -Eq 'role-to-assume:.*vars\.AWS_ROLE_TO_ASSUME' .github/workflows/deploy.yml
          grep -Eq 'role-to-assume:.*vars\.AWS_ROLE_TO_ASSUME' .github/workflows/deploy-ingress.yml
      - name: Check migration bootstrap help
        run: bash scripts/bootstrap-ssm-migration.sh --help >/dev/null
      - name: Test migration bootstrap portability
        run: bash scripts/test-bootstrap-ssm-migration-portability.sh
      - name: Test SSM access bootstrap
        run: bash infrastructure/test-bootstrap-ssm-secrets-access.sh
      - name: Test SSM secret loader
        run: bash scripts/test-load-ssm-secrets.sh
      - name: Validate deployment role template
        run: sam validate --lint --template infrastructure/github-actions-deploy-role.yaml
      - name: Validate Worker invoker template
        run: sam validate --lint --template infrastructure/recordings-worker-invoker.yaml
      - name: Validate ingress deployment bootstrap policy
        run: sam validate --lint --template infrastructure/github-actions-ingress-deploy-policy.yaml
      - name: Validate SSM secrets access policy
        run: sam validate --lint --template infrastructure/github-actions-ssm-secrets-access.yaml

  ingress:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/recordings-ingress
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test
        run: npm test

  transform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transform
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: transform/package-lock.json
      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
          token: ${{ github.token }}
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Syntax check
        run: npm run check
      - name: Validate SAM template
        run: sam validate --lint --template template.yaml
      - name: Build SAM application
        run: sam build --template-file template.yaml
      - name: Publish tested transform SAM build
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        uses: actions/upload-artifact@v4
        with:
          name: recordings-transform-sam-build
          path: transform/.aws-sam/build/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pipeline/package-lock.json
      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
          token: ${{ github.token }}
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Syntax check
        run: npm run check
      - name: Validate SAM template
        run: sam validate --lint --template template.yaml
      - name: Build SAM application
        run: sam build --template-file template.yaml
      - name: Publish tested pipeline SAM build
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        uses: actions/upload-artifact@v4
        with:
          name: recordings-pipeline-sam-build
          path: pipeline/.aws-sam/build/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
