name: Deploy Recordings

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Create a deployment plan or execute the deployment'
        required: true
        default: plan
        type: choice
        options:
          - plan
          - deploy
      confirm_deploy:
        description: 'Required only for deploy: confirm production execution'
        required: true
        default: false
        type: boolean
      pipeline_enabled:
        description: 'EventBridge pipeline state after deployment'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      confirm_disable_pipeline:
        description: 'Required only when pipeline_enabled=false'
        required: true
        default: false
        type: boolean
      confirm_stack_recreate:
        description: 'Emergency recovery only: allow deletion/recreation of an unhealthy recordings stack'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: recordings-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/master' && (inputs.operation == 'plan' || (inputs.operation == 'deploy' && inputs.confirm_deploy == true)) }}
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-2' }}
      PIPELINE_ENABLED: ${{ inputs.pipeline_enabled }}
      SLACK_NOTIFICATIONS_ENABLED: ${{ vars.SLACK_NOTIFICATIONS_ENABLED || 'true' }}
      CALLBACK_TIMEOUT_SECONDS: ${{ vars.CALLBACK_TIMEOUT_SECONDS || '3600' }}
      PLAN_ONLY: ${{ inputs.operation == 'plan' }}
      ALLOW_STACK_RECREATE: ${{ inputs.confirm_stack_recreate }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate requested pipeline state
        if: ${{ inputs.pipeline_enabled == 'false' && inputs.confirm_disable_pipeline != true }}
        run: |
          echo 'pipeline_enabled=false requires confirm_disable_pipeline=true.' >&2
          exit 1

      - name: Record requested operation
        run: |
          echo "### Recordings production ${{ inputs.operation }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Ref: \`${GITHUB_REF}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Pipeline enabled: \`${PIPELINE_ENABLED}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Slack notifications enabled: \`${SLACK_NOTIFICATIONS_ENABLED}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Callback timeout seconds: \`${CALLBACK_TIMEOUT_SECONDS}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Stack recreation permitted: \`${ALLOW_STACK_RECREATE}\`" >> "${GITHUB_STEP_SUMMARY}"

      - name: Check public source boundary
        run: bash scripts/check-public-source.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            transform/package-lock.json
            pipeline/package-lock.json

      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
          token: ${{ github.token }}

      - name: Install transform dependencies
        working-directory: transform
        run: npm ci

      - name: Test transform
        working-directory: transform
        run: |
          npm test
          npm run check
          sam validate --lint --template template.yaml
          sam build --template-file template.yaml

      - name: Install pipeline dependencies
        working-directory: pipeline
        run: npm ci

      - name: Test pipeline
        working-directory: pipeline
        run: |
          npm test
          npm run check
          sam validate --lint --template template.yaml
          sam build --template-file template.yaml

      - name: Validate deployment IAM template
        run: sam validate --lint --template infrastructure/github-actions-deploy-role.yaml

      - name: Verify protected deployment configuration exists
        env:
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          CODE_BUCKET: ${{ secrets.CODE_BUCKET }}
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_GITHUB_ACTIONS_RECORDINGS_APP }}
          BW_RECORDINGS_SHARED_SECRET: ${{ secrets.BW_RECORDINGS_SHARED_SECRET }}
          BW_GEMINI_API_KEY: ${{ secrets.BW_GEMINI_API_KEY }}
          BW_RECORDINGS_DELIVERY_WEBHOOK: ${{ secrets.BW_RECORDINGS_DELIVERY_WEBHOOK }}
          BW_RECORDINGS_SLACK_WEBHOOK: ${{ secrets.BW_RECORDINGS_SLACK_WEBHOOK }}
        run: |
          test -n "${AWS_ROLE_TO_ASSUME}" || { echo 'AWS_ROLE_TO_ASSUME is not configured in the production environment.' >&2; exit 1; }
          test -n "${CODE_BUCKET}" || { echo 'CODE_BUCKET is not configured in the production environment.' >&2; exit 1; }
          test -n "${BWS_ACCESS_TOKEN}" || { echo 'BWS_GITHUB_ACTIONS_RECORDINGS_APP is not configured in the production environment.' >&2; exit 1; }
          test -n "${BW_RECORDINGS_SHARED_SECRET}" || { echo 'BW_RECORDINGS_SHARED_SECRET is not configured as a production environment secret.' >&2; exit 1; }
          test -n "${BW_GEMINI_API_KEY}" || { echo 'BW_GEMINI_API_KEY is not configured as a production environment secret.' >&2; exit 1; }
          test -n "${BW_RECORDINGS_DELIVERY_WEBHOOK}" || { echo 'BW_RECORDINGS_DELIVERY_WEBHOOK is not configured as a production environment secret.' >&2; exit 1; }
          if [[ "${SLACK_NOTIFICATIONS_ENABLED}" == "true" ]]; then
            test -n "${BW_RECORDINGS_SLACK_WEBHOOK}" || { echo 'BW_RECORDINGS_SLACK_WEBHOOK is required when Slack notifications are enabled.' >&2; exit 1; }
          fi

      - name: Load recordings secrets from Bitwarden Secrets Manager
        uses: bitwarden/sm-action@v3.0.1
        with:
          access_token: ${{ secrets.BWS_GITHUB_ACTIONS_RECORDINGS_APP }}
          secrets: |
            ${{ secrets.BW_RECORDINGS_SHARED_SECRET }} > RECORDINGS_TRANSFORM_SHARED_SECRET
            ${{ secrets.BW_GEMINI_API_KEY }} > GEMINI_API_KEY
            ${{ secrets.BW_RECORDINGS_DELIVERY_WEBHOOK }} > RECORDINGS_DELIVERY_WEBHOOK

      - name: Load Slack webhook from Bitwarden Secrets Manager
        if: ${{ env.SLACK_NOTIFICATIONS_ENABLED == 'true' }}
        uses: bitwarden/sm-action@v3.0.1
        with:
          access_token: ${{ secrets.BWS_GITHUB_ACTIONS_RECORDINGS_APP }}
          secrets: |
            ${{ secrets.BW_RECORDINGS_SLACK_WEBHOOK }} > RECORDINGS_SLACK_WEBHOOK

      - name: Configure recordings-only AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: github-actions-recordings-production
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: ${{ inputs.operation == 'plan' && 'Plan transform changes' || 'Deploy transform' }}
        working-directory: transform
        env:
          CODE_BUCKET: ${{ secrets.CODE_BUCKET }}
          S3_PREFIX: recordings/transform
          RECORDINGS_TRANSFORM_SHARED_SECRET: ${{ env.RECORDINGS_TRANSFORM_SHARED_SECRET }}
          SKIP_SAM_BUILD: 'true'
          PLAN_ONLY: ${{ env.PLAN_ONLY }}
          ALLOW_STACK_RECREATE: ${{ env.ALLOW_STACK_RECREATE }}
        run: bash ./deploy.sh

      - name: ${{ inputs.operation == 'plan' && 'Plan pipeline changes' || 'Deploy pipeline' }}
        working-directory: pipeline
        env:
          CODE_BUCKET: ${{ secrets.CODE_BUCKET }}
          S3_PREFIX: recordings/pipeline
          RECORDINGS_TRANSFORM_SHARED_SECRET: ${{ env.RECORDINGS_TRANSFORM_SHARED_SECRET }}
          GEMINI_API_KEY: ${{ env.GEMINI_API_KEY }}
          RECORDINGS_DELIVERY_WEBHOOK: ${{ env.RECORDINGS_DELIVERY_WEBHOOK }}
          RECORDINGS_SLACK_WEBHOOK: ${{ env.RECORDINGS_SLACK_WEBHOOK }}
          SLACK_NOTIFICATIONS_ENABLED: ${{ env.SLACK_NOTIFICATIONS_ENABLED }}
          CALLBACK_TIMEOUT_SECONDS: ${{ env.CALLBACK_TIMEOUT_SECONDS }}
          PIPELINE_ENABLED: ${{ env.PIPELINE_ENABLED }}
          SKIP_SAM_BUILD: 'true'
          PLAN_ONLY: ${{ env.PLAN_ONLY }}
          ALLOW_STACK_RECREATE: ${{ env.ALLOW_STACK_RECREATE }}
        run: bash ./deploy.sh

      - name: Verify deployed resources are describable
        if: ${{ inputs.operation == 'deploy' }}
        run: |
          aws cloudformation describe-stacks --stack-name recordings-transform-lambda --region "${AWS_REGION}" --query 'Stacks[0].StackStatus' --output text
          aws cloudformation describe-stacks --stack-name recordings-pipeline --region "${AWS_REGION}" --query 'Stacks[0].StackStatus' --output text
          aws stepfunctions describe-state-machine --state-machine-arn "$(aws cloudformation describe-stacks --stack-name recordings-pipeline --region "${AWS_REGION}" --query "Stacks[0].Outputs[?OutputKey=='StateMachineArn'].OutputValue | [0]" --output text)" --query 'status' --output text

      - name: Confirm plan was non-executing
        if: ${{ inputs.operation == 'plan' }}
        run: echo 'Change sets were created for inspection only; no CloudFormation resource updates were executed.'
