name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  public-source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check public source boundary
        run: bash scripts/check-public-source.sh

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
          token: ${{ github.token }}
      - name: Syntax-check deployment scripts
        run: bash -n pipeline/deploy.sh transform/deploy.sh infrastructure/bootstrap-deployment-role.sh
      - name: Validate deployment role template
        run: sam validate --lint --template infrastructure/github-actions-deploy-role.yaml

  transform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transform
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: transform/package-lock.json
      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
          token: ${{ github.token }}
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Syntax check
        run: npm run check
      - name: Validate SAM template
        run: sam validate --lint --template template.yaml
      - name: Build SAM application
        run: sam build --template-file template.yaml

  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pipeline/package-lock.json
      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
          token: ${{ github.token }}
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Syntax check
        run: npm run check
      - name: Validate SAM template
        run: sam validate --lint --template template.yaml
      - name: Build SAM application
        run: sam build --template-file template.yaml
