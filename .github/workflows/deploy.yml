name: Deploy Recordings

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      operation:
        description: 'Create a deployment plan or execute the deployment'
        required: true
        default: plan
        type: choice
        options:
          - plan
          - deploy
      confirm_deploy:
        description: 'Required only for deploy: confirm production execution'
        required: true
        default: false
        type: boolean
      pipeline_enabled:
        description: 'EventBridge pipeline state after deployment'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      confirm_disable_pipeline:
        description: 'Required only when pipeline_enabled=false'
        required: true
        default: false
        type: boolean
      confirm_stack_recreate:
        description: 'Emergency recovery only: allow deletion/recreation of an unhealthy recordings stack'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: recordings-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'master' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/master' &&
          (inputs.operation == 'plan' || (inputs.operation == 'deploy' && inputs.confirm_deploy == true))
        )
      }}
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-2' }}
      DEPLOY_OPERATION: ${{ github.event_name == 'workflow_run' && 'deploy' || inputs.operation }}
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      PIPELINE_ENABLED: ${{ github.event_name == 'workflow_run' && 'true' || inputs.pipeline_enabled }}
      SLACK_NOTIFICATIONS_ENABLED: ${{ vars.SLACK_NOTIFICATIONS_ENABLED || 'true' }}
      CALLBACK_TIMEOUT_SECONDS: ${{ vars.CALLBACK_TIMEOUT_SECONDS || '3600' }}
      PLAN_ONLY: ${{ github.event_name == 'workflow_run' && 'false' || (inputs.operation == 'plan' && 'true' || 'false') }}
      ALLOW_STACK_RECREATE: ${{ github.event_name == 'workflow_run' && 'false' || (inputs.confirm_stack_recreate && 'true' || 'false') }}
      SSM_PREFIX: ${{ vars.SSM_PREFIX || '/recordings' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Verify automatic deployment targets current master
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch --no-tags --depth=1 origin master
          current_master="$(git rev-parse origin/master)"
          if [[ "${TESTED_SHA}" != "${current_master}" ]]; then
            echo "Refusing stale automatic deployment: tested ${TESTED_SHA}, current master ${current_master}." >&2
            exit 1
          fi

      - name: Validate requested pipeline state
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.pipeline_enabled == 'false' && inputs.confirm_disable_pipeline != true }}
        run: |
          echo 'pipeline_enabled=false requires confirm_disable_pipeline=true.' >&2
          exit 1

      - name: Record requested operation
        run: |
          echo "### Recordings production ${DEPLOY_OPERATION}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Trigger: \`${GITHUB_EVENT_NAME}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Tested/deployed SHA: \`${DEPLOY_SHA}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Pipeline enabled: \`${PIPELINE_ENABLED}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Slack notifications enabled: \`${SLACK_NOTIFICATIONS_ENABLED}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Callback timeout seconds: \`${CALLBACK_TIMEOUT_SECONDS}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Stack recreation permitted: \`${ALLOW_STACK_RECREATE}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo '- Secrets source: `AWS SSM Parameter Store`' >> "${GITHUB_STEP_SUMMARY}"

      - name: Check public source boundary
        run: bash scripts/check-public-source.sh

      - uses: actions/setup-node@v4
        if: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            transform/package-lock.json
            pipeline/package-lock.json

      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
          token: ${{ github.token }}

      - name: Install transform dependencies
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: transform
        run: npm ci

      - name: Test and build transform for manual deployment
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: transform
        run: |
          npm test
          npm run check
          sam validate --lint --template template.yaml
          sam build --template-file template.yaml

      - name: Download CI-tested transform SAM build
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v5
        with:
          name: recordings-transform-sam-build
          path: transform/.aws-sam/build
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Install pipeline dependencies
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: pipeline
        run: npm ci

      - name: Test and build pipeline for manual deployment
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: pipeline
        run: |
          npm test
          npm run check
          sam validate --lint --template template.yaml
          sam build --template-file template.yaml

      - name: Download CI-tested pipeline SAM build
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v5
        with:
          name: recordings-pipeline-sam-build
          path: pipeline/.aws-sam/build
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Verify CI build artifacts
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          test -f transform/.aws-sam/build/template.yaml || { echo 'Transform CI SAM artifact is missing build/template.yaml.' >&2; exit 1; }
          test -f pipeline/.aws-sam/build/template.yaml || { echo 'Pipeline CI SAM artifact is missing build/template.yaml.' >&2; exit 1; }
          echo "Reusing SAM build artifacts from CI run ${{ github.event.workflow_run.id }} for ${DEPLOY_SHA}."

      - name: Validate deployment IAM template for manual deployment
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: sam validate --lint --template infrastructure/github-actions-deploy-role.yaml

      - name: Verify production deployment configuration exists
        env:
          AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
          CODE_BUCKET: ${{ vars.CODE_BUCKET }}
        run: |
          test -n "${AWS_ROLE_TO_ASSUME}" || { echo 'AWS_ROLE_TO_ASSUME must be configured as a production environment variable.' >&2; exit 1; }
          test -n "${CODE_BUCKET}" || { echo 'CODE_BUCKET must be configured as a production environment variable.' >&2; exit 1; }
          test -n "${SSM_PREFIX}" || { echo 'SSM_PREFIX must not be empty.' >&2; exit 1; }

      - name: Configure recordings-only AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          role-session-name: github-actions-recordings-production
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Load recordings secrets from SSM Parameter Store
        run: bash scripts/load-ssm-secrets.sh deploy

      - name: ${{ env.PLAN_ONLY == 'true' && 'Plan transform changes' || 'Deploy transform' }}
        working-directory: transform
        env:
          CODE_BUCKET: ${{ vars.CODE_BUCKET }}
          S3_PREFIX: recordings/transform
          RECORDINGS_TRANSFORM_SHARED_SECRET: ${{ env.RECORDINGS_TRANSFORM_SHARED_SECRET }}
          SKIP_SAM_BUILD: 'true'
          PLAN_ONLY: ${{ env.PLAN_ONLY }}
          ALLOW_STACK_RECREATE: ${{ env.ALLOW_STACK_RECREATE }}
        run: bash ./deploy.sh

      - name: ${{ env.PLAN_ONLY == 'true' && 'Plan pipeline changes' || 'Deploy pipeline' }}
        working-directory: pipeline
        env:
          CODE_BUCKET: ${{ vars.CODE_BUCKET }}
          S3_PREFIX: recordings/pipeline
          RECORDINGS_TRANSFORM_SHARED_SECRET: ${{ env.RECORDINGS_TRANSFORM_SHARED_SECRET }}
          GEMINI_API_KEY: ${{ env.GEMINI_API_KEY }}
          RECORDINGS_DELIVERY_WEBHOOK: ${{ env.RECORDINGS_DELIVERY_WEBHOOK }}
          RECORDINGS_SLACK_WEBHOOK: ${{ env.RECORDINGS_SLACK_WEBHOOK }}
          SLACK_NOTIFICATIONS_ENABLED: ${{ env.SLACK_NOTIFICATIONS_ENABLED }}
          CALLBACK_TIMEOUT_SECONDS: ${{ env.CALLBACK_TIMEOUT_SECONDS }}
          PIPELINE_ENABLED: ${{ env.PIPELINE_ENABLED }}
          SKIP_SAM_BUILD: 'true'
          PLAN_ONLY: ${{ env.PLAN_ONLY }}
          ALLOW_STACK_RECREATE: ${{ env.ALLOW_STACK_RECREATE }}
        run: bash ./deploy.sh

      - name: Verify deployed resources are describable
        if: ${{ env.PLAN_ONLY == 'false' }}
        run: |
          aws cloudformation describe-stacks --stack-name recordings-transform-lambda --region "${AWS_REGION}" --query 'Stacks[0].StackStatus' --output text
          aws cloudformation describe-stacks --stack-name recordings-pipeline --region "${AWS_REGION}" --query 'Stacks[0].StackStatus' --output text
          aws stepfunctions describe-state-machine --state-machine-arn "$(aws cloudformation describe-stacks --stack-name recordings-pipeline --region "${AWS_REGION}" --query "Stacks[0].Outputs[?OutputKey=='StateMachineArn'].OutputValue | [0]" --output text)" --query 'status' --output text

      - name: Confirm plan was non-executing
        if: ${{ env.PLAN_ONLY == 'true' }}
        run: echo 'Change sets were created for inspection only; no CloudFormation resource updates were executed.'
