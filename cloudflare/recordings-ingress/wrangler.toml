name = "recordings-ingress"
main = "src/index.mjs"
compatibility_date = "2026-09-11"

# Stable Tasker/callback-facing endpoint. Cloudflare manages the DNS/Worker
# routing for this custom domain; generated workers.dev/Lambda hostnames are
# not part of the public client contract.
routes = [
  { pattern = "recordings.alf-broadcast.co.uk", custom_domain = true }
]

# Set these as encrypted Worker secrets, never in this file:
#   RECORDINGS_SHARED_SECRET
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#
# Non-secret configuration is intentionally explicit. Origin Function URLs are
# overridden by deploy-ci.sh from the deployed AWS resources.
[vars]
AWS_REGION = "eu-west-2"
UPLOAD_ORIGIN_URL = "REPLACE_WITH_IAM_PROTECTED_UPLOAD_FUNCTION_URL"
CALLBACK_ORIGIN_URL = "REPLACE_WITH_IAM_PROTECTED_CALLBACK_FUNCTION_URL"
